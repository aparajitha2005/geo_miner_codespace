name: GeoMiner Pipeline

on:
  workflow_dispatch:

jobs:

  numeric_preprocessing:
    name: Preprocess Numeric Data
    runs-on: ubuntu-latest

    steps:
      - name: Numeric preprocessing
        run: echo "Preprocessing numeric data..."

  imagery_preprocessing:
    name: Preprocess Imagery Data
    runs-on: ubuntu-latest

    steps:
      - name: Imagery preprocessing
        run: echo "Preprocessing imagery data..."

  geological_model:
    name: Geological Discovery Model
    needs:
      - numeric_preprocessing
      - imagery_preprocessing
    runs-on: ubuntu-latest

    steps:
      - name: Run Geological Discovery Model
        run: echo "Running Geological Discovery Model..."

  probability_output:
    name: Probability Output
    needs: geological_model
    runs-on: ubuntu-latest

    steps:
      - name: Generate probability output
        run: echo "Generating probability output..."
